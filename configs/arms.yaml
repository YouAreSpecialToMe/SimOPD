# SimOPD arm registry — single source of truth for every run in the audit.
#
# One arm = vanilla + exactly one knob turned (SimOPD-casefile.md §3, 8 axes).
# Everything else comes from the locked protocol (PROTOCOL-unified.md §1), so an
# arm definition only ever lists its own deviation. `run_id` is the wandb run name,
# the eval artifact prefix, and the verdict-ledger row key — never rename one.
#
# status:
#   stock  = runs on unmodified verl today
#   needs  = blocked on the loss/seam listed in `seam` (INFRA-NOTES 接缝图)
#
# Usage:
#   python scripts/arm.py list [--status stock]
#   python scripts/arm.py env <run_id>      # env-var block for run_opd_baseline.sh

arms:
  # ---- baseline (the reference every verdict is measured against) ----
  - run_id: vanilla
    axis: "-"
    desc: "sampled-token reverse KL (k1) as per-token advantage, PG form"
    status: stock
    note: "k1_rec is bit-identical to verl's k1 and adds the Delta-ell quantile panel
           that METRICS.md requires on every run, baseline included"
    env:
      DISTILLATION_LOSS_MODE: k1_rec

  # ---- A: rollout source & schedule ----
  - run_id: a1_gkd_mix0.5
    axis: A
    desc: "GKD lambda=0.5 on/off-policy mixing (2306.13649)"
    status: stock
    note: "STOCK 2026-08-16 via the DLC unlock: precompute + machine-verdicted
           3-step rehearsal enforced IN-JOB by deploy/dlc/a_axis_fleet.sh
           (P->R->L gates; criteria unchanged, deploy/dsw/rehearse_a_axis.sh
           exits nonzero on any miss and the job refuses to launch lanes).
           CODE LANDED 2026-08-06 (src/simopd/gkd_mix.py + scripts/gen_offpolicy.py);
           status flips to stock after the precompute lands and a 3-step GPU rehearsal
           passes. Knobs are PARKED under env2_pending until then -- flipping status
           without renaming that key ships an arm with no env at all, i.e. a second
           vanilla under a1's name (arm_lint refuses it since r6).
           AUDIT r6 2026-08-09 vs the paper's own text (fetched): GKD's lambda is
           per-BATCH and the objective is a FULL-VOCAB divergence optimized by DIRECT
           backprop -- 'we do not backpropagate through the student sampling
           distribution'. Ours is a per-(prompt,step) coin on the protocol's SAMPLED
           k1 under PG. The r4 line 'ratio is identically 1 so the gradients coincide'
           is WITHDRAWN: direct gives mean grad(log pi_S) while PG gives
           mean(loss * grad(log pi_S)); they are not the same estimator, and for a
           sampled-token loss the direct branch would push the sampled tokens DOWN.
           Consequence to state in the verdict: because the sampled estimator's
           direction follows whoever sampled, the off-policy half contributes
           log-ratio-weighted cloning of teacher text rather than GKD's supervised-KD
           term. a1 therefore doses THE DATA SOURCE under our estimator; it does not
           reproduce GKD's objective. A faithful variant (lambda mixing on a
           distributional top-k divergence, direction fixed by D) is an amendment
           candidate, not this arm"
    env:
      SIMOPD_GKD_CACHE: /mgfs/shared/Group_GY/changhao/simopd_data/gkd_offpolicy.parquet
      SIMOPD_GKD_LAMBDA: "0.5"
    seam: "REVISED 2026-08-06: the i1 surgery pattern opens a cheaper path than the
           TransferQueue surgery originally feared. Rollout-server injection: patch
           the STUDENT's vllm server; a prompt-hash-deterministic coin (lambda=0.5)
           routes hit prompts to a cached teacher response (precomputed once via the
           gen_coldstart stage-1 machinery over ALL train prompts) with the student
           engine SCORING that text for log_probs instead of generating. Downstream
           (teacher scoring, loss, PG) untouched. Recorded deviation: GKD's off-policy
           half is a direct loss; under our PG base with one epoch per batch the ratio
           is identically 1 and the gradients coincide -- estimator-note.md argument.
           Sequenced AFTER i1 (shares the injection machinery); target: ready before
           wave S/T so axis A ships complete"

  - run_id: a3_offpolicy
    axis: A
    cohort: supplement            # 后补批(2026-08-07 起新增臂均属此批):主名册已在跑,
                                  # 本批解锁后在 DSW 单独加发,不并入首发算术。
    desc: "GKD lambda=0 endpoint: pure off-policy, fixed teacher (X,Y), teacher-scored"
    status: stock
    note: "STOCK 2026-08-16 via the DLC unlock (same in-job P->R->L gates as a1,
           deploy/dlc/a_axis_fleet.sh). ADDED 2026-08-07 (axis-A completeness analysis): the plan's own Sec 2 axis
           text registers GKD lambda in {0, 0.5} but only 0.5 ever materialized.
           This is the missing endpoint -- the survey's 'teacher-forced' cell, the
           pre-OPD classic baseline (off-policy KD with logits), and the third
           point that turns the lambda ladder {0, 0.5, 1} into a dose-response
           curve. Zero new code: gkd_mix at P(off-policy)=1.0 -- NOTE THE INVERSION
           our knob is P(off-policy), so GKD's lambda=0 is OUR '1.0' (the exact
           trap gkd_mix's comment warns about, used deliberately here). Same fixed
           full-prefix-keyed cache as a1 (the paper's fixed (X,Y) variant), same
           PG ratio-identically-1 argument (estimator-note), same 3-step rehearsal
           gate; both flip stock together when the cornell precompute lands.
           AUDIT r6 2026-08-09: the paper sanctions a teacher-generated fixed set
           ('such a dataset can be generated by sampling sequences from the teacher')
           but its lambda=0 experiments use GROUND-TRUTH outputs and it never ablates
           the teacher-generated variant -- ours is the sanctioned-but-unevaluated
           form, forced here because this data has no gold CoT. Same estimator caveat
           as a1 and stronger: at P(off-policy)=1 EVERY token is teacher-sampled, so
           E[k1] is minus the forward KL and the PG advantage makes the arm pure
           log-ratio-weighted cloning of teacher text. Read it as the data-source
           endpoint, never as 'supervised KD'"
    env:
      SIMOPD_GKD_CACHE: /mgfs/shared/Group_GY/changhao/simopd_data/gkd_offpolicy.parquet
      SIMOPD_GKD_LAMBDA: "1.0"
    seam: "identical to a1_gkd_mix0.5 (shared machinery); unlock = a1's unlock"

  - run_id: a4_dagger_anneal
    axis: A
    cohort: supplement
    desc: "DAgger anneal (2605.12913): P(off-policy) = lambda(step), 1.0 -> 0.0, whole-response coin"
    status: stock
    note: "STOCK 2026-08-16 via the DLC unlock (in-job P->R->L gates,
           deploy/dlc/a_axis_fleet.sh; rehearsal additionally machine-checks
           lambda_target descending in the sideband).
           ADDED 2026-08-15 (DAgger import): gives the lambda ladder {a3, a1,
           vanilla} its SCHEDULE dimension. Same gkd_mix machinery; the coin's
           dose is lambda(step) from src/simopd/gkd_schedule.py -- a verbatim
           port of STACX dagger_schedule.py::DAggerSchedule (same four modes,
           warmup/decay semantics, equations), so recipes quoted in the paper's
           units transfer by renaming iteration -> step. Both knobs are
           P(teacher-sourced): no inversion (unlike the paper-lambda trap above).
           MIXING ATOMICITY: whole-response per-(prompt,step) coin -- the
           single-turn image of the paper's turn-level rule (it rejects
           token-level interleaving as unstable); in single turn the mixture
           exists only ACROSS the batch, every sequence single-author.
           PRIMARY shape mode=linear,start=1.0,end=0.0,decay=250: mean dose over
           250 steps = 0.502 == a1's constant 0.5, so {a1, a4} isolates schedule
           SHAPE at matched average dose (the c2_qb_fixed8 discipline).
           REGISTERED ADJUDICATOR, not launched with the primary: decay=125 --
           the published agentic recipe (0.2/round x 10 iters) in normalized
           time: anneal done at 50%, second half pure on-policy consolidation.
           Launch it if the primary reads well or the your-last-checkpoint-only-
           just-went-on-policy objection becomes load-bearing. a2 comparison is
           RECIPE-level only: a2's off-policy dose sits outside the 250-step
           budget (separate SFT stage, held-out prompts, true SFT objective) --
           unmatchable by construction; any verdict must say so. ESTIMATOR
           caveat inherited from a1/a3 verbatim: sampled k1 under PG follows the
           sampler, so teacher-sourced sequences contribute log-ratio-weighted
           cloning (NOT STACX mixture_dagger_opd's unweighted CE branch; their
           student branch is K3, ours k1). a4 doses the data-source SCHEDULE
           under our estimator; it does not reproduce their objective.
           TELEMETRY (CPU battery 30/30, scripts/gkd_schedule_battery.py):
           per-step server-side bucket -> gkd_stats sideband -> k1_rec emits
           distillation/gkd_lambda_target, gkd_lambda_realized (hit/eligible),
           gkd_teacher_token_frac (delivered-token dose), token/miss counts,
           gkd_stats_step (join key; trails trainer step by ~1 by design).
           PRE-REGISTER at launch (RESULTS-GAPS discipline): F3 lens -- early
           phase every sequence carries teacher EOS supervision (median 694
           tok) => no lock; whether short-form survives the lambda -> 0 handoff
           IS the gradual-vs-abrupt mechanism question vs a2."
    env:
      SIMOPD_GKD_CACHE: /mgfs/shared/Group_GY/changhao/simopd_data/gkd_offpolicy.parquet
      SIMOPD_GKD_SCHEDULE: "mode=linear,start=1.0,end=0.0,warmup=0,decay=250"
    seam: "a1's rollout-server injection + gkd_schedule (step-dependent coin) +
           gkd_stats relay (server -> trainer wandb bridge, same-node lane
           assumption documented in the module). Unlock = a1's unlock (same
           cache, same 3-step rehearsal; rehearsal must additionally show
           lambda_realized tracking the schedule and the wandb gkd_* panel
           populating) + gkd_schedule_battery green"

  - run_id: a5_aggrevate
    axis: A
    cohort: supplement
    desc: "AggreVaTe (2605.12913 Eq.9): student prefix 0..kappa-1, ONLINE teacher completes from kappa"
    status: stock
    note: "STOCK 2026-08-16 via the DLC unlock (in-job P->R->L gates,
           deploy/dlc/a_axis_fleet.sh; rehearsal machine-checks the sentinel
           strip, the outcome-sum invariant, and the duplicate-request-id
           hazard from verification NEW-ISSUE 3).
           ADDED 2026-08-15 (DAgger import, phase 2); seam LANDED same day
           (src/simopd/a5_aggrevate.py + teacher_registry.py + the sitecustomize
           teacher_model hook; CPU battery 15/15). Single-switch roll-in, the exact image
           of STACX aggrevate_pure: kappa ~ U{0, T_max(step)} fresh per
           (prompt, step); student generates tokens 0..kappa-1, the teacher
           completes from kappa to termination. One contiguous handoff -- never
           token-interleaving (rejected as unstable in the multi-turn work; same
           reasoning binds harder in flat text). T_max(step) reuses
           gkd_schedule: mode=linear,start=0,end=16384,decay=250 -- kappa=0 at
           step 0 IS the paper's iter-0 pure-teacher cold start, and the ramp
           shares a4's normalized window so {a4, a5} isolates mixing STRUCTURE
           (batch-atomic vs within-sequence switch) with the schedule pinned.
           RECORDED PROPERTY, not a bug: kappa~U front-loads the teacher --
           P(any teacher tail) ~ min(1, L_student/T_max), so realised
           teacher_token_frac decays faster than the nominal ramp; the telemetry
           row is the honest dose and comparisons run on realised curves.
           Teacher tail is generated ONLINE (a fixed cache is impossible: the
           prefix depends on current student weights) at the protocol's rollout
           params (tau=1.0, top-p=1.0, budget 16384-kappa) in the student
           template -- gen_offpolicy.py's discipline, applied live. Loss needs
           no surgery: the protocol estimator already follows the executor
           per token (r6 reading -- student segment standard OPD, teacher
           segment log-ratio-weighted cloning). KAPPA FORM: raw token position
           is the primary (faithful to Eq.9's U{0,T_max}); boundary-snapped
           kappa (nearest newline/step marker -- multi-turn hands off at turn
           boundaries, flat text has none) is the registered variant, launch
           only if the primary's handoff-quality confound becomes load-bearing.
           WHY still status=needs: (1) SIMOPD_A5_KEYS membership set -- CPU-only,
           `gen_offpolicy.py --dry` emits real prefix hashes with stub responses,
           so a5's unlock does NOT wait on the GPU cache; (2) 3-step rehearsal
           (must show the kappa histogram, realised tail_token_frac tracking the
           ramp, both segments' student logprobs flowing, and the teacher-side
           sentinel strip -- the kappa=0 bare-prompt tail call is the recursion
           trap the battery cannot reach); (3) pre-register predictions in the
           ledger. Telemetry (fixed key set, zero-filled -- the d3-quads
           same-key-count discipline): gkd_tmax, gkd_kappa_mean,
           gkd_tail_token_frac, and six outcome counters
           (mixed / pure_student / full_teacher / cap_full / degraded /
           aborted) whose sum equals gkd_n_seen -- the lost-sequence check.
           Natural-stop discrimination is a kappa+1 probe: this verl maps both
           vllm finish reasons to stop_reason='completed', so <=kappa returned
           tokens is the proof of a natural stop, kappa+1 the proof of a cap."
    env:
      SIMOPD_A5_TMAX_SCHEDULE: "mode=linear,start=0,end=16384,warmup=0,decay=250"
      SIMOPD_A5_KEYS: /mgfs/shared/Group_GY/changhao/simopd_data/gkd_offpolicy.parquet.dry
    seam: "LANDED 2026-08-15. Same vLLMHttpServer.generate wrap family as gkd_mix
           (mutually exclusive with it -- install refuses SIMOPD_GKD_CACHE):
           student prefix capped at kappa -> teacher ONLINE continuation via a
           server actor handle resolved through the named simopd_teacher_registry
           (published by the sitecustomize wrap of MultiTeacherModelManager;
           verl's own load balancer is an unnamed actor) -> stitched TokenOutput
           with full student logprobs via the score-not-generate trick. Aborted
           tail/scoring degrades that sequence to its student prefix, counted as
           gkd_degraded -- never silently vanilla. 3-step rehearsal after a4's."

  - run_id: a2_coldstart
    axis: A
    desc: "off-policy SFT cold start then OPD (Rethinking recipe)"
    # Status is FLEET-LOCAL. Upstream gated this 2026-08-07 because cornell lacks
    # the SFT checkpoint (EXPANSION 8.1 #6); THIS fleet built and verified its own
    # 2026-08-07 (env paths below, hf/ export) and its three seeds have since
    # reached step 250 -- so stock here, needs there. The 2026-08-12 merge kept
    # `stock` for that reason; the running fingerprints keep the record straight.
    status: stock
    note: "two-stage: run slurm/coldstart.sbatch first (teacher generations, filtered,
           then verl SFT), which also writes the remainder split.
           AUDIT r6 2026-08-09 (their vllm_rollout.py + LlamaFactory config read
           line by line): (1) r5 CORRECTION -- their --enable-rejection-sampling is a
           VALIDITY filter (is_valid_output: must contain \\boxed, reject repeated
           lines / n-gram / consecutive-block repetition, retry <=3), NOT verifier
           correctness. Our default is now their filter, ported with their thresholds;
           correctness filtering survives as --filter verifier, an OUR-side ablation.
           (2) SFT hyperparameters imported literally from their
           qwen3_base_full_sft.yaml: 1 epoch (was 2), lr 1e-5, cosine, warmup 0.05.
           cutoff_len 14336 vs our 17408 = the 16k protocol scaling, registered.
           (3) DECLARED DEVIATION: their SFT config sets enable_thinking: True while
           their teacher rollouts and their OPD phase are both non-thinking; we render
           BOTH stages non-thinking so the cold start conditions on exactly what OPD
           and eval condition on. We test the recipe SHAPE, not their template mix.
           Cold-start prompts are RESERVED out of this arm's OPD phase so warm-up
           cannot be credited to seeing the same questions twice; the cost is that
           this arm sees fewer distinct prompts (reported in coldstart_meta.json)
           AUDIT 2026-08-19 (CPU, scripts/analysis/a2_coldstart_probe.py; receipt
           docs/data/a2_coldstart_probe.txt): the init is termination-broken
           because of the TERMINATOR, not the length. The SFT target is the
           student-template render and ends <|im_end|>\n -- the teacher's
           terminator -- with <|endoftext|> in 0/6358 rows (pad only, loss_mask 0);
           the rollout honors only <|endoftext|> (hf export generation_config eos
           151643). After 98 steps: p(<|im_end|>) ~1e-3 at the end of a
           teacher-CoT answer, p(<|endoftext|>) crushed 0.98 -> 1e-3 (never a
           target, the CE competitor at exactly those positions), mass on the
           closing-template continuation ('\n\n' 0.52 -> '---\n\n**Answer:**
           \boxed{}' = the terminal loop) -> 65% capped at step 1, 100% from 35.
           Rethinking's own recipe (LlamaFactory qwen3 template, replace_eos=True,
           stop_words=[<|im_end|>]) makes THEIR SFT'd student's eos <|im_end|>, so
           their OPD rollouts stop on it; our verl-sft_trainer port with the Base
           tokenizer untouched lost that. This arm as run tests an init that
           cannot terminate by construction. Corrected cell (RESULTS-GAPS A1'):
           terminate the SFT target as ...<|im_end|><|endoftext|> (teacher's next
           token after <|im_end|> is <|endoftext|> at 1.0; base 0.59), rebuild
           stage 2, then the OPD seeds"
    env:
      # Fleet-local paths (2026-08-08, was /scratch/zz865 + /home/zz865 -- Cornell).
      # Each fleet supplies its own stage-1 artifact; this one was built and verified
      # on this fleet 2026-08-07 (SFT to step 98, merged HF export under hf/ -- the
      # PARENT dir holds only FSDP shards and loads in nothing).
      # MERGE NOTE 2026-08-11: this artifact PREDATES audit r6 -- built with
      # correctness (verifier) filtering, 2-epoch SFT, verl-default lr. Under the
      # r6 taxonomy the three flying 16k rows are therefore the --filter verifier
      # ABLATION cell, not the validity recipe cell; the recipe cell needs a fresh
      # stage-1 under the pinned hyperparameters (relabel tracked in campaign.tsv).
      STUDENT_MODEL: /mgfs/shared/Group_GY/changhao/simopd_data/ckpt/coldstart_sft/hf
      DATA_DIR: /mgfs/shared/Group_GY/changhao/simopd_data/simopd_math
      TRAIN_FILE_BASENAME: train_coldstart_remainder.parquet

  # ---- B: divergence ----
  - run_id: b1_skew_kl
    axis: B
    desc: "skew-KL alpha=0.1 (DistiLLM 2402.03898)"
    status: stock
    note: "src/simopd/losses.py; mixture log-density is exact from the two
           sampled-token logprobs, so this stays on the same C axis as vanilla.
           Verified: alpha->0 collapses to k1, and the estimator is bounded by -log(alpha)"
    env:
      DISTILLATION_LOSS_MODE: skew_kl_a0.1

  - run_id: b2_forward_kl
    axis: B
    desc: "forward KL, teacher top-k form (completeness arm: the known-worse control)"
    status: stock
    note: "verl's forward_kl_topk is top-k and NOT renormalized; that is a C-axis
           confound, so this arm is reported as forward-KL-topk, not plain forward KL"
    env:
      DISTILLATION_LOSS_MODE: forward_kl_topk
      # AUDIT 2026-08-07: divergence-valued losses take verl's DIRECT branch
      # (its own comment cites GKD), not PG -- under PG the advantage is
      # -KL <= 0 everywhere: indiscriminate suppression of every sampled
      # token with no replacement direction. (r5 note: LSM's and EOPD's official
      # code turned out to be PG -- see c1/b3 -- so the citation here is verl's
      # own GKD reference and our own registered designs, nothing else.)
      USE_POLICY_GRADIENT: "False"
      DISTILLATION_TOPK: "32"

  - run_id: b3_eopd_gate
    axis: B
    desc: "per-token entropy routing: reverse KL where teacher is confident, forward KL where spread (EOPD 2603.07079, ICML 2026)"
    status: stock
    note: "AUDIT r5 2026-08-07, against the OFFICIAL CODE (WLS04/EOPD core_algos):
           'augmenting' is literal -- pg_loss = pg_loss + soft_kd_loss. The reverse-KL
           PG base (vanilla's sampled-k1 advantage, clipped surrogate) runs on EVERY
           token, and high-teacher-entropy tokens ADD a top-k forward-KL term with a
           FIXED absolute threshold (their default 0.8 nats) and coefficient 1.0,
           normalized by total valid tokens. The 2026-08-06 registration pre-committed
           to exactly this flip ('switch-vs-add is the internal ablation if the full
           text says otherwise'), so this executes that clause; r3's where(fkl,rkl)
           switch on the direct branch is superseded -- EOPD's own loss is PG-based
           throughout, the additive term alone is directly differentiated (delivered
           past the PG detach by simopd/b3_additive.py). Recorded deviations: teacher
           entropy from top-k truncation (theirs is full-vocab from the ref pass;
           under-shoots, so the 0.8 gate fires on fewer tokens -- b3_gate logs the
           realised fraction, teacher_mass the unseen tail) and micro-batch
           normalization of the additive term"
    env:
      DISTILLATION_LOSS_MODE: eopd_entropy_gate
      DISTILLATION_TOPK: 32
      # r5: PG branch (verl default) -- the official base; the sampled column is
      # consumed again for the k1 base loss.
      SIMOPD_KEEP_SAMPLED: "1"
      SIMOPD_B3_ENT_THRESH: "0.8"
      SIMOPD_B3_SOFT_COEF: "1.0"
      # 4-card lane (2026-08-08, this fleet): the KEEP_SAMPLED family hits a hard
      # margin wall at the 16k cap on 2-card lanes -- full-vocab entropy + the
      # sampled column + activation growth toward the cap kill every run at
      # ~35-45 steps (measures generation included; g2_s0 died at step 39 asking
      # 150MiB against ~200 free). Same shape and same recording discipline as
      # the n8 cell: actor DP-2 + two teacher replicas, topology fingerprinted.
      NGPUS_PER_NODE: "2"
      TEACHER_WORLD_SIZE: "2"

  - run_id: b4_jsd
    axis: B
    cohort: supplement
    desc: "generalized JSD-beta on renormalized teacher top-k, beta=0.5 (GKD 2306.13649)"
    status: stock
    note: "ADDED 2026-08-07 (B-axis completeness): the plan's own axis-B text promised
           JSD-beta and skew-KL displaced it -- this pays the debt with GKD's own
           divergence, in TRL's canonical interpolation form (audited r5:
           m = beta*T + (1-beta)*S, jsd = beta*KL(T||m) + (1-beta)*KL(S||m)).
           beta=0.5 symmetric canonical point; SIMOPD_JSD_BETA pre-registered
           internal ablation (GKD: optimum task-dependent over {0.1,0.5,0.9}).
           Distributional both sides on the renorm top-k support (teacher-outer
           half is not sampled-estimable; truncation recorded, teacher_mass
           quantifies), DIRECT branch per GKD. the scaled limits jsd/beta (beta->0)
           and jsd/(1-beta) (beta->1) recover the renorm FKL and RKL respectively
           (endpoints themselves degenerate to zero; verified numerically) -- so b4
           interpolates the axis's two endpoints"
    env:
      DISTILLATION_LOSS_MODE: jsd_topk
      USE_POLICY_GRADIENT: "False"
      DISTILLATION_TOPK: "32"
      SIMOPD_JSD_BETA: "0.5"

  - run_id: b4_jsd_b0.1
    axis: B
    cohort: supplement
    desc: "JSD-beta=0.1 (teacher-leaning rung of b4's pre-registered beta ladder)"
    status: stock
    note: "ADDED 2026-08-11: executes the internal ablation registered WITH b4_jsd on
           2026-08-07 (SIMOPD_JSD_BETA over GKD's own {0.1,0.5,0.9}; GKD reports the
           optimum is task-dependent, so a single beta cannot stand for the divergence).
           Zero new code -- same jsd_topk kernel, same renorm top-32 support, same
           DIRECT branch; beta is the ONLY moving part across the three rungs, which is
           what makes the ladder readable. Scaled limits (verified numerically with
           b4): jsd/beta -> renorm FKL as beta->0, so this rung is the mass-covering
           end WITHOUT leaving the distributional family.
           WHY NOW (the 16k read this rung adjudicates): the campaign's B-axis result
           is that FKL content is fatal in one form (b3 adds a top-k FKL term onto the
           sampled PG base -> 0.003, the only arm that collapses and never returns) and
           merely mediocre in another (b2's global truncated FKL, chronic ~0.46), while
           b4 at the symmetric midpoint is stable (0.524@250). Two hypotheses survive:
           (H1) once the signal is DISTRIBUTIONAL, direction is second-order -- all
           three rungs then land close together; (H2) direction still drives the
           outcome and the midpoint merely averages two failure modes -- the rungs then
           spread monotonically. They make opposite predictions, which is the point"
    env:
      DISTILLATION_LOSS_MODE: jsd_topk
      USE_POLICY_GRADIENT: "False"
      DISTILLATION_TOPK: "32"
      SIMOPD_JSD_BETA: "0.1"

  - run_id: b4_jsd_b0.9
    axis: B
    cohort: supplement
    desc: "JSD-beta=0.9 (student-leaning rung of b4's pre-registered beta ladder)"
    status: stock
    note: "ADDED 2026-08-11, the other end of the same ladder -- see b4_jsd_b0.1 for
           the registration and the H1/H2 framing. Scaled limit jsd/(1-beta) -> renorm
           RKL as beta->1, so this rung is the mode-seeking end. It carries the sharper
           of the two readings: the sampled-token RKL arms (vanilla and its family) are
           exactly the ones that collapse late, so if mode-seeking per se drove that
           collapse this rung should be the ladder's worst; if instead the collapse
           belongs to the SAMPLED estimator rather than to the direction, this rung
           stays as flat as b4@0.5 and the collapse story is settled on the C axis, not
           this one. Same kernel/support/branch as the other two rungs"
    env:
      DISTILLATION_LOSS_MODE: jsd_topk
      USE_POLICY_GRADIENT: "False"
      DISTILLATION_TOPK: "32"
      SIMOPD_JSD_BETA: "0.9"

