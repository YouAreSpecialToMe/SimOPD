  - run_id: n2_termcal
    axis: N
    cohort: supplement
    desc: "[OURS] termination-marginal calibration = the non-starving DENSE termination channel: vanilla + an exact full-softmax stop-vs-continue term at EVERY visited state (stopping mass is restored even where the student never samples STOP), BCEWithLogits(m_t, q_t) with q_t = teacher mass on ITS terminators and m_t = student log-odds of the tokens that END its rollout; the termination chapter's minimal causal cell"
    status: stock
    note: "REGISTERED 2026-08-19 as n2_eos_aux (single-token EOS calibration);
           RE-REGISTERED the same day, before any run, as termination-marginal
           calibration after the stop-token audit (docs/MECHANISMS.md sec M-J,
           scripts/analysis/eos_stop_audit.py; user design note 2026-08-19).
           WHAT: L = L_vanilla^{k1} + lambda * BCEWithLogits(m_t, q_t) per response
           token, q_t = sum_{e in E_T} p_T(e | s_t) exact (full log_softmax, force-
           gathered by simopd.eos_gather, never top-k renormalized), m_t = log-odds
           of sum_{e in E_S} p_theta(e | s_t). dL/dm_t = p_t - q_t in [-1,1]:
           teacher-calibrated stopping, both directions. It asks only 'end now vs
           continue', never which terminator token -- the second-layer term
           q_stop * KL(q(e|stop) || p(e|stop)) is deliberately NOT included, so
           the channel changes the termination hazard and nothing else. Bounded on
           the log-odds by construction (no +80-class kicks).
           WHY TWO SETS (the audit): the student ends a rollout ONLY on
           <|endoftext|> 151643 (tokenizer/generation_config eos, vLLM's sole stop
           in training and eval; 99% of stopped eval responses end on it directly,
           no <|im_end|> before it) and puts ~1e-11 on <|im_end|>; the Instruct
           teacher ends a response on <|im_end|> 151645 -- at the student's stop
           positions q_T(<|im_end|>) median 0.95, q_T(<|endoftext|>) median 1.4e-11
           (rank ~2e4, never inside any top-k). Same EVENT, disjoint TOKENS. So the
           event is read on each side with that side's own terminators: E_S =
           {151643} (what ends the student's rollout), E_T = {151643, 151645} (what
           the teacher ends with). Single-token 151643 (the original registration)
           would calibrate p(stop) toward 1e-11 -- an anti-stop channel; a symmetric
           union would let student mass on <|im_end|>, which does NOT stop its
           rollout, count as stopped. With E_S = {151643} the aggregate log-odds
           gradient lands on the token that ends rollouts, and a student mass on a
           teacher-only terminator counts as CONTINUE.
           THE SAME AUDIT IS A MECHANISM RECEIPT: vanilla's sampled-column k1 gives
           the student's stop token Delta-ell = log q_T(eot) - log p_S(eot) = -25
           nats (median over 30 real stopped rollouts; the single most negative
           reward of the response in 25/30, beyond p99.9 in all) at EVERY stop
           event, with the teacher's own terminator unreachable (never sampled at
           p ~1e-11), so no positive stop signal ever arrives: vanilla@250 has
           p(eot) median 6e-5 at natural stop positions (base 0.98), c2/c4@250 keep
           0.997 -- renorm KL puts zero gradient on out-of-support tokens, so the
           base's stop survives untouched, and neither ever learns <|im_end|>
           (~1e-14). The exact-top-k arms do not SUPPLY stopping; they stop
           PUNISHING it. N2 is the supply-side test on top of the punishing base;
           panel eos_dl_at_stop logs the -25 live.
           NOT changed: rollout source, sampled k1 on the sampled column, PG branch,
           every non-stop teacher coordinate, no renorm, no distributed matching,
           token-mean aggregation. The term says how much to stop, never which
           continuation token to write.
           PREREGISTERED: P-EOS = holds an interior equilibrium (~c2/c4 band) =>
           a non-starving stop channel is sufficient against the punishing base;
           F3's support dichotomy collapses to one event. P-support = locks like
           vanilla with q >> p on the panels => the exact family's stability is
           the exemption of the sampled stop from punishment (G_late-side), not
           supply -- then the reward-level fix (terminal-token event-level Delta-ell)
           is the next cell. P-teacher = locks with q ~ p ~ 0 beyond the answer =>
           teacher-side conditional degeneration on student-induced late states.
           Secondary: vs c2/c4 capability -- N2 stable but ~vanilla/h3 capability
           => c2's gain splits into termination + content (distributed direct).
           IMPLEMENTATION CONTRACT: q must be exact. An id missing from the payload
           is -inf and the kernel REFUSES it (a silent q=0 would manufacture an
           anti-stop gradient exactly at collapse onset).
           lambda=1.0 canonical; internal ablation ladder {1, 3, 10, 30}, sized by
           the forward audit A_EOS/A_cont before any rung is launched -- the audit
           above says the PG kick on the stop logit is ~25*(1-p) per stop event, so
           the ladder is now open UPWARD, not downward. Not to be stacked with
           g6_seqmean until each moves the fixed point on its own; then the 2x2
           {V, S, E, S+E}.
           Panels: eos_aux_term; eos_q/p/dstop by position band 0-100/100-500/
           500-2k/2k+; eos_ravail_500up = E[(q-p)_+]; q and dstop split by
           novel-vs-repetition (8-gram); eos_qm_i/eos_pm_i per member of E_S u E_T
           (0 = <|endoftext|>, 1 = <|im_end|>); eos_n_stop / eos_q_at_stop /
           eos_p_at_stop / eos_dl_at_stop at the student's own stop tokens;
           eos_sampled_is_stop (the sampled-stop event rate, R_stop's old channel).
           LANE: the protocol's 2-GPU lane, deliberately -- unlike the D/b3/g2
           KEEP_SAMPLED family (NGPUS 2 + TWS 2) this kernel never materializes
           [T, V] on the student side (streaming lse, one index_select for the
           stop logits, chunked entropy/top-k for the diagnostics), and the
           teacher's log_softmax cost does not depend on k, so a top-66 payload
           costs what c1-c4's top-32 costs on the same lane. TOPK 66 = 64 true
           top-k (non-extra tokens) + 2 gathered ids (151643, 151645); the sampled
           column rides KEEP_SAMPLED as for D, tensor width 67. If the 3-step
           rehearsal shows student-side pressure at 16k, move to the 4-GPU family
           by adding NGPUS_PER_NODE=2 TEACHER_WORLD_SIZE=2 and pinning."
    env:
      DISTILLATION_LOSS_MODE: k1_termcal
      DISTILLATION_TOPK: 66
      SIMOPD_KEEP_SAMPLED: "1"
      SIMOPD_GATHER_EOS: "1"
      SIMOPD_EOS_IDS: "151643"
      SIMOPD_EOS_TEACHER_IDS: "151643,151645"
      # Rollout stop CONTRACT (simopd.stop_set, A-AXIS R5 appendix, 2026-08-19): the
      # launcher now defaults NEW runs to the dual set {151643,151645}. This arm is a
      # single-knob comparison against the banked vanilla rows, which trained under the
      # legacy single-eos contract, so it pins "off" explicitly (E_S = {151643} above must
      # equal the rollout stop set; eos_gather refuses a mismatch at import). A v2 pair
      # of this cell needs a vanilla_v2 control first; then E_S becomes "151643,151645".
      SIMOPD_STOP_IDS: "off"
      SIMOPD_EOS_AUX_COEF: "1.0"
      SIMOPD_SHADOW: "0"
