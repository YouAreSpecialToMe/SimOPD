  - run_id: g6_seqmean
    axis: G
    cohort: supplement
    desc: "[OURS] vanilla with per-sequence loss normalisation: w_i = 1 instead of w_i ∝ T_i"
    status: stock
    note: "ENLISTED 2026-08-18. Zero new kernel code: verl already implements the
           mode (core_algos.py:1187 seq-mean-token-mean) and the distillation path
           forwards config.loss_agg_mode into BOTH branches -- PG via
           compute_policy_loss_vanilla -> agg_loss (core_algos.py:1273) and direct
           via agg_loss. vanilla is PG, so it takes effect. The launch script
           hard-coded token-mean until today.
           WHY: G owns the trajectory weight w, but every G arm so far varies WHICH
           trajectories (verified-only, failure-only, FIRE likelihood, RGOPD gate).
           Nothing on the roster has ever varied w's LENGTH-PROPORTIONALITY, so the
           coordinate is untested in the one respect that interacts with collapse.
           Under token-mean a collapsed 16,384-token rollout enters the batch with
           ~40x the weight of a healthy 410-token one, and the 2026-08-18 textdump
           measurement puts 81.3% of those tokens in repeated 8-grams whose delta_ell
           median is 0.000 -- the batch is dominated by sequences that are both
           longest and emptiest. This is also the third of Finding 1's positive
           feedback loops and the only one a single config value can cut.
           NOTE it is not really a new method: UNIFIED-LOSS §1 states the shipped
           selection layer AS the nested double mean, which IS seq-mean-token-mean.
           That claim holds only where every sequence keeps the same token count
           (the H/G masked arms, kept = K); for every m=1 arm the code ships
           token-mean instead. This arm makes the framework's own estimator real.
           PREREGISTERED READ: seq-mean scales G_late and R_stop within a sequence
           by the same 1/T_i, so the within-sequence force ratio is UNCHANGED and
           only between-sequence weight moves. Still collapses => Finding 1's
           within-sequence two-force account survives its only competing mechanism
           (batch composition), which strengthens the claim. Does not collapse =>
           loop three is load-bearing, Finding 1 needs a batch term, and a one-knob
           collapse prophylactic falls out. Judged against vanilla x3 (30/30 cells,
           complete), same everything, this one env var the only knob"
    env:
      SIMOPD_LOSS_AGG_MODE: seq-mean-token-mean

  - run_id: n0_termfix
    axis: N
    cohort: supplement
    desc: "[OURS] semantic alignment of the target representation: STOP token ratio -> STOP event ratio. Vanilla with ONE change -- at the student's own stop tokens the per-token signal is the EVENT-level Delta-ell (log q_T(E_T) - log p_theta(E_S)) instead of the token-level log q(<|endoftext|>) - log p(<|endoftext|>); no new loss, no new gradient channel; the artifact-isolation cell of the termination chapter"
    status: stock
    note: "REGISTERED 2026-08-19 (user proposal after the stop-token audit: 'when the
           student samples <|endoftext|>, read the teacher's <|im_end|> probability').
           WHAT: L = L_vanilla^{k1}, sampled column, PG branch, token-mean -- except
           at positions where the sampled token is in E_S = {151643} (the student
           actually stopped): there Delta-ell = log sum_{E_T} p_T(e) - log
           sum_{E_S} p_theta(e), E_T = {151643, 151645}. Every other position is
           bit-identical to vanilla (same kernel ingredients as the D-axis `raw`).
           No coefficient, no extra channel, no supply at positions where nothing
           was sampled (that is N2's question). The teacher's judgement about WHEN
           to stop is kept: q_T(E_T) is small mid-answer, so a premature stop is
           still punished -- only the vocabulary-convention penalty goes.
           WHY (audit, docs/MECHANISMS.md M-I, docs/data/eos_stop_*.txt): the
           student's rollout terminator (<|endoftext|>) and the teacher's response
           terminator (<|im_end|>) are different tokens; vanilla scores every stop
           event at Delta-ell = -25 nats (median over 30 real stopped rollouts) for
           that convention, and the teacher's own terminator is never sampled
           (p ~1e-11), so no positive stop signal ever arrives; vanilla@250 has
           p(<|endoftext|>) 6e-5 at natural stop positions (base 0.98) while
           c2/c4@250 keep 0.997 because renormalized support KL exempts the
           out-of-support stop from punishment. N0 removes the -25 and nothing else.
           PREREGISTERED: P-artifact = N0 holds an interior fixed point (c2/c4 band)
           => vanilla's collapse is (mostly) the identity mismatch and the exact
           family's stability is the exemption, not supply -- the practitioner
           finding of the chapter (Base student + Instruct teacher under vLLM/verl
           defaults). P-drive = N0 locks like vanilla (interval, not just endpoint)
           => the continuation drive is real beyond the terminal token; N2's supply
           channel is then the live question, and the two together read the
           2x2 {V, N0, N2, N0+N2}. Secondary: N0's capability vs vanilla/c2 --
           if the artifact was the whole story, N0 should approach c2's 0.68.
           WHAT IT DOES NOT DO (collaborator framing 2026-08-19): stop supervision
           reaches the student ONLY when it actually samples STOP. If p_S(STOP)
           keeps falling for any other reason, N0's correction opportunities fall
           with it -- N0 corrects the SIGN of the stop event and keeps sampled-OPD's
           starvation of DENSITY intact; it cannot pull a locked policy back. That
           is by design: N0 = semantic alignment, N2 = non-starving supply, and the
           pair splits the problem. The starvation is measured live: eos_n_stop
           (sampled-stop events per micro-batch) IS the correction-opportunity
           count, read next to the truncation trajectory.
           Corner (monitored, not fixed here): a sampled <|im_end|> is NOT in E_S,
           so it keeps its token-level signal (log q_T(im_end) - log p ~ +25 when
           it happens); at p ~1e-11 it does not happen, and eos_pm_1 (student mass
           on <|im_end|>) is the watch panel -- if it drifts up the corner is live.
           Payload = N2's: SIMOPD_GATHER_EOS + KEEP_SAMPLED, TOPK 66 (64 true top-k
           + 2 gathered ids + sampled), teacher cost independent of k, protocol
           2-GPU lane, streaming kernel (no [T, V]); the top-k columns feed only
           the overlap diagnostics.
           Panels: the shared termination panels (see n2_termcal) with
           eos_dl_at_stop = the applied event-level value (expect ~log 0.95 - log
           0.98 at natural ends) and eos_dl_at_stop_raw = vanilla's token-level
           value (expect ~-25) side by side -- the mechanism receipt, live."
    env:
      DISTILLATION_LOSS_MODE: k1_termfix
      DISTILLATION_TOPK: 66
      SIMOPD_KEEP_SAMPLED: "1"
      SIMOPD_GATHER_EOS: "1"
      SIMOPD_EOS_IDS: "151643"
      SIMOPD_EOS_TEACHER_IDS: "151643,151645"
      # Rollout stop CONTRACT (simopd.stop_set, A-AXIS R5 appendix, 2026-08-19): the
      # launcher now defaults NEW runs to the dual set {151643,151645}. This arm is a
      # single-knob comparison against the banked vanilla rows, which trained under the
      # legacy single-eos contract, so it pins "off" explicitly (E_S = {151643} above must
      # equal the rollout stop set; eos_gather refuses a mismatch at import). A v2 pair
      # of this cell needs a vanilla_v2 control first; then E_S becomes "151643,151645".
      SIMOPD_STOP_IDS: "off"
      SIMOPD_SHADOW: "0"

