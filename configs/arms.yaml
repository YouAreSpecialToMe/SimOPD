      TEACHER_WORLD_SIZE: "2"

  - run_id: j1_kdrl
    axis: J
    desc: "dense k2-KL + sparse verifier reward via true GRPO groups, n=8 (KDRL 2506.02208)"
    status: stock
    note: "AUDITED against the paper (no code released, recorded): J_KDRL = J_GRPO -
           beta*KL^k2 -- GRPO on rule-based outcome rewards plus a directly
           differentiated k2 KL term on student rollouts, their ablation preferring
           k2 over k3. Faithful mapping: verl's combine branch IS this objective
           (use_task_rewards=True => policy_loss + distillation_loss_coef *
           distill_loss), beta = their fixed main default 2e-3; the annealing
           variant (5e-3 -> 1e-3, delta 5e-5/step) is the pre-registered internal
           ablation. n=8 restores real group advantages (failures get negative
           pressure -- the half of the RL signal that n=1 deletes); verdict base =
           vanilla_n8, same cell. Remaining recorded deviations: 32-prompt steps
           (2x tokens vs main table, cell-boundary deviation), and their long-CoT
           R1-style regime vs the audit tier -- true of every arm"
    env:
      DISTILLATION_LOSS_MODE: k2_kdrl
      USE_POLICY_GRADIENT: "False"
      USE_TASK_REWARDS: "True"
      DISTILLATION_LOSS_COEF: "0.002"
      ROLLOUT_N: "8"
      TRAIN_BATCH_SIZE: "32"
      PPO_MINI_BATCH_SIZE: "32"
      # 4-card lane, same shape as vanilla_n8 (see its note); topology fingerprinted.
      NGPUS_PER_NODE: "2"
      TEACHER_WORLD_SIZE: "2"

  - run_id: g2_fire_likelihood
    axis: G
    desc: "drop bottom-20% trajectories by normalized teacher logprob (FiRe 2606.02684)"
    status: stock
    note: "AUDIT r4 2026-08-07: the arm had implemented only the title's first half.
           Now both stages verbatim (Eq.4-8, formulas fetched from the paper): Eq.4
           trajectory filter (bottom 20% by mean teacher logprob) THEN Eq.5-8 token
           reweighting w=(1+a*cT)(1+b*cS), per-trajectory mean-normalized, on the
           signed k1 advantage. Needs teacher top-k for per-token teacher entropy ->
           moved to the top-k path with the sampled column. Recorded deviations:
           micro-batch (not full-batch) max-normalization and thresholds; teacher
           entropy truncated to top-k (teacher_mass quantifies). Stays PG family:
           FiRe's own setup is advantage-based with PPO clip.
           AUDIT r5 2026-08-07, official code (YuYingLi0/FiRe-OPD dp_actor.py) vs
           paper: eight of nine items match (filter statistic sum/len, skip
           percentile 20, cT/cS with valid-token max, alpha=beta=1.0, weights
           detached onto the RKL advantage; full-vocab teacher entropy remains our
           recorded top-k truncation deviation). The ninth is a paper-vs-code split:
           Eq.8 normalizes w by its PER-TRAJECTORY mean, the code by the mean over
           ALL training tokens post-filter -- resolved code-ward as with c1, so a
           uniformly-confident trajectory keeps weight above 1 instead of being
           flattened. Their rollout-IS correction (threshold 5.0) is their infra,
           not the arm, and is not imported.
           PRE-REGISTERED DECOMPOSITION (2026-08-07): SIMOPD_FIRE_MODE
           filter_only / reweight_only ablate which half of the title carries the
